<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Channels blocked</h1>
      <span id="count" class="count">0</span>
    </header>

    <div id="empty" class="empty" hidden>
      No channels blocked yet.<br />
      Open a video and hit <strong>🚫 Don't recommend</strong> next to Subscribe
      to tell YouTube to stop recommending that channel.
    </div>

    <ul id="list"></ul>

    <section class="settings">
      <div class="row">
        <span>
          <strong>Shortcut</strong>
          <small>Block the current channel while watching.</small>
        </span>
        <button id="shortcut" class="shortcut-btn" type="button">Shift+B</button>
      </div>
    </section>

    <footer>
      <span class="foot-note">Sent to YouTube — account-wide.</span>
      <button id="export" class="link-btn">Export</button>
      <button id="clear" class="link-btn danger">Clear list</button>
    </footer>
  </body>
  <script src="popup.js"></script>
</html>
